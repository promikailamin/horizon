[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Android arm64 entry point for Horizon (loads as libhorizon_android.so)"

[lib]
path = "../horizon-client/src/android_main.rs"
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.15"
log = "0.4"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
